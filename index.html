<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">

    <div class="container">
        <h1 class="page-title">Quote Machine</h1>
        <div class="header">
             <select id="category-filter" class="category-select" aria-label="Filter quotes by category">
                <option value="all">All Categories</option>
            </select>
            <div class="theme-switcher">
                <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12,9c1.65,0,3,1.35,3,3s-1.35,3-3,3s-3-1.35-3-3S10.35,9,12,9 M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5 S14.76,7,12,7L12,7z M2,13h2c0.55,0,1-0.45,1-1s-0.45-1-1-1H2c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13h2c0.55,0,1-0.45,1-1 s-0.45-1-1-1h-2c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1S11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.02-0.39-1.41,0 s-0.39,1.02,0,1.41l1.06,1.06c0.39,0.39,1.02,0.39,1.41,0s0.39-1.02,0-1.41L5.99,4.58z M18.36,16.95c-0.39-0.39-1.02-0.39-1.41,0 s-0.39,1.02,0,1.41l1.06,1.06c0.39,0.39,1.02,0.39,1.41,0s0.39-1.02,0-1.41L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.02,0-1.41 s-1.02-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.02,0,1.41s1.02,0.39,1.41,0L19.42,5.99z M7.05,18.36 c0.39-0.39,0.39-1.02,0-1.41s-1.02-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.02,0,1.41s1.02,0.39,1.41,0L7.05,18.36z"></path></svg>
                <input type="checkbox" id="theme-toggle" aria-label="Toggle theme">
                 <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9.37,5.51C9.19,6.15,9.1,6.82,9.1,7.5c0,4.08,3.32,7.4,7.4,7.4c0.68,0,1.35-0.09,1.99-0.27C17.45,17.19,14.93,19,12,19 c-3.86,0-7-3.14-7-7C5,9.07,6.81,6.55,9.37,5.51z M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36 c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.82,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z"></path></svg>
            </div>
        </div>

        <div class="quote-box">
            <div id="quote-display">
                <noscript>
                    <p class="quote-text">The greatest glory in living lies not in never falling, but in rising every time we fall.</p>
                    <p class="quote-author">Nelson Mandela</p>
                </noscript>
                <p class="quote-text"></p>
                <p class="quote-author"></p>
            </div>
        </div>
        
        <div class="buttons">
            <button id="copy-btn" class="btn">
                 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16,1H4C2.9,1,2,1.9,2,3v14h2V3h12V1z M19,5H8C6.9,5,6,5.9,6,7v14c0,1.1,0.9,2,2,2h11c1.1,0,2-0.9,2-2V7 C21,5.9,20.1,5,19,5z M19,21H8V7h11V21z"></path></svg>
                <span id="copy-btn-text">Copy</span>
            </button>
            <button id="tweet-btn" class="btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M22.46,6C21.78,6.33,21.04,6.56,20.27,6.69C21.09,6.21,21.7,5.49,21.98,4.64C21.2,5.1,20.36,5.42,19.47,5.6 C18.71,4.79,17.58,4.3,16.32,4.3c-2.4,0-4.34,1.94-4.34,4.34c0,0.34,0.04,0.67,0.11,0.98C8.28,9.45,5.15,7.74,3.02,5.12 C2.66,5.74,2.46,6.46,2.46,7.22c0,1.5,0.77,2.83,1.94,3.6C3.7,10.79,3.07,10.6,2.5,10.3v0.05c0,2.1,1.5,3.85,3.48,4.25 c-0.36,0.1-0.75,0.15-1.14,0.15c-0.28,0-0.55-0.03-0.81-0.08c0.55,1.72,2.15,2.98,4.04,3.01c-1.49,1.17-3.37,1.87-5.41,1.87 c-0.35,0-0.7-0.02-1.04-0.06C4.42,20.32,6.72,21,9.25,21c7.5,0,11.61-6.22,11.61-11.61c0-0.18,0-0.35-0.01-0.53 C21.45,8.12,22.04,7.1,22.46,6z"></path></svg>
                Tweet
            </button>
            <button id="new-quote-btn" class="btn">New Quote</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
